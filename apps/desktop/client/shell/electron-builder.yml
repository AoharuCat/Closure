# 发布身份（08-28 快速发布）：GitHub 公仓 AoharuCat/Closure（M2 双仓 = upstream）。
appId: com.aoharucat.closure
productName: Closure
copyright: Copyright © 2026 AoharuCat

directories:
  output: ../../../../release
  buildResources: resources

files:
  - dist/**
  - resources/**
  # craft KB 种子走下方 extraResources（asar 外）——watcher 的 fs.watch 与
  # getCraftKbBundledDir 的 existsSync 探测都认 process.resourcesPath/craft-kb，
  # asar 内副本无消费者反增包体。
  - "!resources/craft-kb/**"
  - package.json
  - node_modules/**
  # Trim packaging bloat. These are either non-runtime build artifacts or
  # renderer-only libs that Vite already bundles into dist/renderer.
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/better-sqlite3/build/Release/obj/**"
  - "!node_modules/material-symbols/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"

# asar 外运行时静态资源（shell spec bundled-resources 同族债，08-28 release prep 补）：
# - craft-kb：getCraftKbBundledDir() 只认 process.resourcesPath/craft-kb（dev 返回
#   null 走 user 目录，打包版不补 = 手艺库读空）。
# - prompts：wireAgentPromptsDir() 的打包候选 process.resourcesPath/prompts——
#   agent 契约 yaml（dogfood #48 注入缝），不补 = 全部 agent degrade to empty。
extraResources:
  - from: resources/craft-kb
    to: craft-kb
  - from: ../../agent/prompts
    to: prompts

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**"
  # sqlite-vec loadable extension binaries (.dll/.dylib/.so). SQLite cannot read
  # inside an asar, so they must be unpacked; the @photostructure/sqlite-vec
  # fork's getLoadablePath() rewrites app.asar -> app.asar.unpacked to find them.
  - "**/@photostructure/sqlite-vec/**/*.{so,dylib,dll}"

npmRebuild: true
buildDependenciesFromSource: false

win:
  icon: resources/icon.ico
  # arch 单源在 config：release.yml 用裸 `--win`（CLI 显式 target/arch 列表会整体
  # 覆盖 config per-target arch——targetFactory.computeArchToTargetNamesMap 对带
  # targetNames 的 raw 原样返回）。arm64 产物为理论级（无真机验证，README 已知
  # 限制明示；better-sqlite3 electron-v136 / sqlite-vec / jieba 的 arm64 预编译均在位）。
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Closure

# 禁用 blockmap（增量更新）的多发产物，减少 Release 页附件数量。
# （electron-builder 26 已移除 electronDifferentialDownload 根级开关。）
generateUpdatesFilesForAllChannels: false

# macOS 同时出 arm64(Apple Silicon) 与 x64(Intel) 两份 dmg + zip。
# zip 备妥 electron-updater mac 更新所需的 feed 形态（latest-mac.yml 引 zip；早期
# dmg-only 缺该形态）。⚠️ 但未签名构建（identity: null）会被 electron-updater 拒绝
# 安装——mac 更新链在代码签名落地前整体不可用，zip 只是必要非充分条件，升级目前
# 须手动下载。两 target 各双 arch，单次构建产出单份 latest-mac.yml（签名落地即用）。
mac:
  # 单张高分辨率 PNG 即可，electron-builder 在 macOS 构建机上自动转 .icns。
  icon: resources/icon.png
  category: public.app-category.productivity
  # Alpha 阶段无 Apple 开发者证书，显式关闭签名，避免打包失败。
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

linux:
  icon: resources/icon.png
  category: Office
  target:
    - target: AppImage # 跨发行版的免安装可执行格式
      # arm64 为理论级（预编译原料在位，无真机验证）；x64 为主分发面。
      arch:
        - x64
        - arm64

# GitHub Releases 直传（本地构建 --publish always 走 GH_TOKEN；CI release.yml 同源）。
# releaseType: release = 上传到既有正式 release（默认 draft 在「同 tag 已有 published
# release」时会整批 skipped publishing——v0.1.0 mac/linux 产物蒸发实录）。
publish:
  provider: github
  owner: AoharuCat
  repo: Closure
  releaseType: release
