writing:
  chapters:
    title: "章节"
    empty: "还没有章节——先在大纲里立起结构"
    hint: "点章节打开稿件 tab；带点的章 = 有链运行/待审"
    # 09-13 子3 W6（design §6.3）：章卡衍生状态——stale 徽标 + 重提取按钮态。
    staleBadge: "衍生待更新"
    reExtract: "重提取"
    reExtractBusy: "提取中"
  chains:
    label: "链"
  # W6：多会话条 chip（章号主标签 + 待审 badge；fallback 复用 writing.run.fallbackTitle）。
  chip:
    chapter: "第 {n} 章"
    badge: "待审"
  run:
    fallbackTitle: "写章链"
    chapter: "第 {n} 章 · {title}"
    status:
      running: "运行中"
      paused: "待审"
      completed: "已完成"
      error: "失败"
      aborted: "已中断"
    modelFallback: "↻ 回退自 {from}"
    # 09-18 CR 批 B（CR-4②/CR-11）：paused 链在 run 相位的「进审阅」手动再入钮 + loop 完成后
    # 摘要条常驻「自审收敛 N 圈」chip（D-e 圈数三处可见之一）。
    enterReview: "进审阅"
    lapsDone: "自审收敛 {n} 圈"
  # 09-18 CR 批 B（CR-12）：空时间线 idle 行按 run 状态分文案（原实现恒显「生成中」）。
  timeline:
    idleRunning: "正在生成…"
    idlePaused: "已暂停——等待审阅"
    idleEmpty: "无时间线数据"
  empty:
    title: "暂无运行中的写章链"
    body: "写章仍从对话栏发起——告诉 AI 写哪一章、要什么方向；链跑起来后，这里显示全程时间线（思考/工具/产出/正文流）。"
  noProject:
    title: "未打开项目"
    body: "打开或新建一个项目后，这里会成为写章链的运行观测面。"
  # 09-13 子3 W5（design §1.3/§4）：审阅相位（相位容器 + 终稿卡 + escalate 裁决卡 + stub 降级卡）。
  review:
    pauseKind:
      final: "终稿待审"
      escalate: "灰区裁决"
      brief: "规划审"
      suspension: "挂起核查"
      guard: "保义护栏"
      draft: "草稿审"
      stub: "已暂停"
      pending: "正在准备审阅"
    tlToggle: "▤ 时间线"
    collapse: "收起审阅"
    drawerTitle: "时间线 · 回看"
    # 09-18 CR 批 B（CR-10）：pending 占位（chapter_review metadata 在途——stub 卡瞬闪防）。
    pending:
      body: "暂停载荷传输中，审阅卡即将就绪……"
    final:
      title: "终稿审阅"
      docSub: "终稿 · 可直接手改，也可选中文字让 AI 精修"
      summaryTitle: "AI 自审摘要"
      summaryVerdictLabel: "结论"
      summaryReasonsLabel: "理由"
      summaryReasons: "理由 {n} 条"
      summaryLint: "去AI味报告"
      loops: "自审收敛 {n} 圈 · 未触上限"
      loopsCapped: "自审收敛 {n} 圈 · 已触环上限"
      summaryMissing: "（本载荷无自审摘要——如实缺席）"
      dirty: "有手改未接受"
      accept: "接受并继续"
      acceptWithEdits: "接受并继续（携 {n} 处手改）"
      invalidEdit: "手改后正文为空——清空正文请改用「放弃本章」"
      redo: "打回重写…"
      abort: "放弃本章"
      redoPanelTitle: "打回重写 · 修订意见"
      required: "必填"
      redoHint: "意见将作为修订指令注入下一圈写手"
      redoRequiredHint: "空意见无法打回——说明修订方向（防 AI 瞎猜）"
      redoPlaceholder: "说明打回原因与期望方向，AI 将按意见定向修订……"
      redoSubmit: "提交打回（整章）"
      reason1: "动机铺垫还是不够"
      reason2: "后半节奏太快"
      reason3: "对话太书面"
      reason4: "环境描写再加"
      abandonTitle: "放弃本章？"
      abandonBody: "放弃将中断本链段，已产出的草稿不落盘、时间线保留可回看。"
      abandonConfirm: "确认放弃"
      selectionBar: "选区操作"
      selectionRefine: "指令精修"
      intentCardTitle: "选区指令精修"
      escHint: "Esc 取消"
      intentPlaceholder: "对选中段落下指令，例如：把犹豫写得更克制，删掉「像是」的明喻……"
      compileIntent: "编译意图 → 确认卡"
    escalate:
      title: "灰区裁决 · 环内"
      hint: "路由判决拿不准，请作者裁决。逐条勾选处置（勾选自动合成结构化意见，AI 按条执行——不必全放行也不必全打回）："
      route: "路由：{route}"
      itemsTitle: "裁决 findings"
      itemsCount: "{n} 条"
      pick:
        accept: "接受为真相"
        revise: "修订"
        ignore: "忽略"
      supplementPlaceholder: "补充说明（可选——勾选了「修订」的条目建议写明修订方向）"
      submit: "按勾选提交"
      submitCounts: "（接受 {accept} 条 · 修订 {revise} 条）"
      submitDisabledHint: "全部未勾或全忽略时不可提交——逐条给出处置"
      abort: "放弃本章"
    stub:
      title: "写章链已暂停"
      body: "该链暂停但无审阅载荷（直跑链车道无 checkpoint 事件面）。可继续续跑或放弃；需要完整审阅形态请从对话栏发起写章。"
      resume: "继续"
      abort: "放弃"
  # 09-13 子3 W6（design §6.2）：终态产物区三态卡 + 章卡衍生状态动作文案。
  outcome:
    completedTitle: "链完成"
    completedSub: "提取段对终稿一次完成——衍生状态天然一致。"
    duration: "总时长 {d}"
    noRows: "（本 run 无提取段产出帧——衍生状态请以章卡与设定面为准）"
    openProse: "打开稿件 →"
    openWorld: "世界面板 →"
    openChat: "设定卡审阅 →"
    worldEvents: "世界事件"
    promises: "伏笔登记"
    unitEvents: "条"
    unitItems: "项"
    errorTitle: "链失败"
    errorAt: "失败于 {node}——上游已完成节点的时间线与产出保留，可排查。"
    errorAtUnknown: "失败节点未知（终帧未达）——上游已完成节点的时间线与产出保留，可排查。"
    noErrorDetail: "（无错误明细帧——可复制诊断后查主进程日志归因）"
    retryHint: "恢复通道：正文已落的章可在左侧章节列「重提取」；或回对话栏重新发起。链 error 后快照存活性未核实——不承诺断点重跑。"
    copyDiagnostics: "⧉ 复制诊断"
    copied: "诊断已复制到剪贴板"
    copyFailed: "复制失败（剪贴板不可用）"
    backToChat: "回对话栏重新发起"
    abortedTitle: "链已中断"
    abortedBody: "链段被中断——若非你在审阅中主动放弃，则是运行被动中断（流被掐 / 回合结束）。"
    abortedKept: "已产出的思考、调查与产出快照仍保留在上方时间线，可回看。"
  derivation:
    done: "重提取完成：衍生状态已刷新"
    failed: "重提取失败：{reason}"
    reviewStaged: "重提取完成：{n} 个设定补丁待审阅（对话栏）"
    landed: "重提取完成：{fields} 已自动落盘"
    # CR-6：staging 守卫两态——异 runId 待审批不覆写 / 无活跃会话承载审阅。
    pendingConflict: "已有待审批补丁，请先处理审阅卡——本次反哺补丁未暂存"
    noSession: "重提取完成，但当前无活跃会话承载审阅——反哺补丁未暂存"
