    huoke: "获客漏斗"
    qidaigan: "期待感与铺垫"
    jiegou: "结构与多线"
    renshe: "人设与成长"
    shijieguan: "世界观容纳度"
    qingxu: "情绪与爽点"
    wenbi: "文笔与画面感"
    zaogeng: "造梗与互动"
    xinxicha: "信息控制"
    shijian: "时间三轴"
    fubi: "伏笔形态学"
    duizhao: "对照与变奏"
    style: "风格维"
