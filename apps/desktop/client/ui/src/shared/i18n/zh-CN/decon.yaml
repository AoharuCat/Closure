# 「拆书」页（E10.3b W6，独立左导航页）i18n 全词表。
# 文案中文化纪律（mirror craft.yaml/materials.yaml）：zh 界面零英文术语露出；键名（代码
# 标识符 = 契约字段原样）不受限。
# 权威词表源：维度 13 = contracts/closure-decon.ts DECON_DIMENSIONS（受控封闭）；状态
# 七态 / reportKind 四 kind = 契约枚举原样。网文语境纪律：平实网文语言（粗拆/细拆/深度/
# 待人工确认）。
decon:
