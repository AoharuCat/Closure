  cliAuthDead: "CLI login has expired ({keyName}) — switch accounts or run agy in a terminal to log in again"
  # Text agent fallback toast (09-19 CLI whitelist W4; the shell pushes once per process.
  # Self-healed — the turn already reran on the no-agent lane, with prompt hardening as backstop.
  # Copy corrected per F12: no more "did not take effect" attribution (a built-in tool step is not
  # evidence the agent failed to load) — it says only what was observed and what was done)
  cliTextAgentFallback: "The Closure text agent invoked a built-in agy tool this turn — automatically reran the turn in standard mode."
