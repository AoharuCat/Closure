# ── 09-12 子4 W6: agy MCP tool bridge (CLI dialogue-lane tool surface; design §4/§8) ──
agyBridge:
  sectionTitle: "MCP Tool Bridge"
  sectionSubtitle: "Lets dialogue models connected through the Antigravity CLI call Closure's writing tools (chapter writing, setting lookups, research, and more). Tools run inside the model's own turn; progress and results show up in the conversation as usual."
  loading: "Reading tool bridge status…"
  statusFailed: "Failed to read the tool bridge status."
  stateOk: "Authorized"
  stateMissingConsent: "Not set up"
  stateConflict: "Config conflict"
  stateDeclined: "Declined"
  homeRootLabel: "Copy location"
  okNote: "Enabled. The authorization copy of your agy profile exists only for the duration of a writing session and is deleted when it ends; your agy configuration and credential store are never touched."
  missingConsentNote: "Not yet authorized. Enabling copies your agy profile (including cached login credentials) into Closure's own data directory for the session, deleted when it ends — your original configuration and credential store stay untouched (zero writes)."
  declinedNote: "You previously chose not to enable this: CLI-model conversations run in plain-text mode (no tool calls). You can re-authorize at any time."
  conflictTitle: "Conflicts with your agy permission rules"
  conflictHint: "The rules below override the bridge's authorization (agy's deny/ask takes precedence over allow). Adjust your agy settings.json yourself and re-check here; Closure will never edit those rules for you."
  conflictBlocked: "Your consent was recorded, but the agy permission rules above still block tool calls — adjust the rules first."
  conflictReasonUnavailable: "No specific conflicting rules were read, so the conflict reason is unavailable — try re-checking later."
  recheck: "Re-check"
  authorize: "Authorize now"
  reauthorize: "Re-authorize"
  authorizeDone: "Authorized — resend your message to use the tool bridge."
  revoke: "Turn off tool bridge"
  revokeConfirmTitle: "Turn off the MCP tool bridge?"
  revokeConfirmBody: "The authorization returns to not-set-up; CLI models in conversations fall back to plain-text mode (no writing tools). You can re-authorize at any time."
  revokeActiveSessions: "Bridge sessions are in progress ({n}) — finish the related conversations before turning it off."
  revokeFailed: "Turn-off failed (storage read/write error) — please retry."
  revoked: "Tool bridge turned off."
  close: "Close"
  # Informed-consent dialog (design §4.3 four disclosure items + ToS note [shared component, key = settings.cliTosRiskNote])
  consentTitle: "Enable the MCP tool bridge?"
  consentIntro: "To let the current dialogue model (connected via Antigravity CLI) call writing tools, a one-time authorization is needed. Please read the following honestly-worded disclosures:"
  disclosureCopiesLabel: "What gets copied"
  disclosureCopies: "Your entire agy configuration directory (~{sizeMb}MB, which includes a copy of the cached login credentials)."
  disclosureWhereLabel: "Where it is stored"
  disclosureWhere: "The copy lives in a Closure data directory under your local user profile, with the same access level as the original:"
  disclosureLifecycleLabel: "When it is cleaned up"
  disclosureLifecycle: "Deleted as soon as each writing session ends; leftovers from abnormal exits are swept on app startup."
  disclosureNoGlobalWriteLabel: "Your configuration is untouched"
  disclosureNoGlobalWrite: "Your real agy configuration and credential store are never modified (zero writes)."
  decline: "Not now"
  declineHint: "This choice is remembered: conversations with this model continue in plain-text mode (you can re-enable later under Settings → Models)."
  consentAuthorizeDone: "Authorized — resend your last message to use the tool bridge."
  consentDeclinedDone: "Choice remembered — conversations with this model continue in plain-text mode."
  consentWriteFailed: "Failed to record the authorization, please retry."
  declineWriteFailed: "Failed to save your choice, please retry."
