name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    # 三平台矩阵：及早暴露路径分隔符、原生模块 ABI 等平台差异问题。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pnpm store cache (cache: pnpm above) can be restored in a state where
      # better-sqlite3 is linked but its native binding was never built, because
      # --frozen-lockfile treats the package as already installed and skips its
      # `install` script. Force the prebuilt binary to be fetched so the agent
      # tests that load the real module don't fail with "Could not locate the
      # bindings file". Recursive form actually runs the script (non-recursive
      # `pnpm rebuild better-sqlite3` is a no-op when the store is warm).
      - name: Rebuild native modules (better-sqlite3)
        run: pnpm rebuild -r better-sqlite3

      - name: Type check
        run: pnpm typecheck

      - name: Lint (boundary + security gates)
        run: pnpm lint

      - name: Test
        run: pnpm test

      # ── 启动冒烟（三平台各一次；R8 / design D4）───────────────────────────
      # 前置 test 步把 better-sqlite3 重建成了 Node ABI（vitest 用）——Electron 主进程
      # 直接加载会 ABI 断裂（NODE_MODULE_VERSION 不匹配，db 打开即挂）。冒烟前必须
      # 翻回 Electron ABI：rebuild:native = electron-rebuild，prebuild 优先下载
      # electron-ABI 预编译，三平台 runner 均无需 C++ 工具链。
      - name: Rebuild native modules (Electron ABI, for smoke)
        run: pnpm rebuild:native

      - name: Build shell (renderer + main)
        run: pnpm --filter @orison/desktop-shell build

      # 真主进程拉起到 ready-to-show 即退（ORISON_SMOKE=1 通道，marker + exit 0 判定，
      # 脚本内 120s 自杀兜底）。win/mac runner 自带桌面会话直跑；
      # ubuntu runner 无显示会话而 BrowserWindow 需要 X——xvfb 装配 + xvfb-run 包裹。
      - name: Startup smoke (Electron main to ready)
        if: matrix.os != 'ubuntu-latest'
        working-directory: apps/desktop/client/shell
        run: node scripts/ci-smoke.mjs
        timeout-minutes: 5

      - name: Startup smoke (Electron main to ready, xvfb)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          cd apps/desktop/client/shell
          xvfb-run -a node scripts/ci-smoke.mjs
        timeout-minutes: 5
